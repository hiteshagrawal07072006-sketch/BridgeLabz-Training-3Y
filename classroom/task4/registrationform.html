<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    

<h2 style=" text-align:center" > Student Registration Form</h2>
    
<form action="/submit", method="post">


<table align="center" border="2" width="100%" cellpadding="10" >

<tr margin="10px" >
    <th colspan="2"> 
       Registration Form
    </th>
</tr>

<tr>
    <td>Full Name</td>
    <td><input type="text" placeholder="Enter Your name"></td>

</tr>

<tr>
    <td>Email</td>
    <td><input type="email" placeholder="Enter Your Email"></td>

</tr>

<tr>
    <td>Phone Number</td>
    <td><input type="number" placeholder="Enter Your ph."></td>

</tr>

<tr>
    <td>Gender</td>
    <td>

   <section>

    <input id="male" type="radio" name="gender">
    <label for="male">Male</label>
    
    <input id="female" type="radio" name="gender">
    <label for="female">Female</label> 
    
    <input id="others" type="radio" name="gender">
    <label for="others">Other</label> 

    </section>
    </td>


</tr>



<tr>
    <td>Skills</td>
    <td>
    

    <input type="checkbox" value="html">
    <label>HTML</label>
    
    <input type="checkbox" value="css">
    <label>CSS</label> 
    

    <input type="checkbox" value="javascript">
    <label>JAVASCRIPT</label> 
    </td>

    <tr>

        <td>Course</td>
        <td><select>
          <option value="" >Select Course</option>
          <option value="B.TECH" >B.TECH</option>
          <option value="BCA" >BCA</option>
          <option value="M.TECH" >M.TECH</option>
          <option value="MCA" >MCA</option>
          <option value="MBA" >MBA</option>
        </select>
            
        </td>

    </tr>

    <tr>

        <td>Address</td>
        <td><textarea name="address" rows="5" cols="30"></textarea></td>

    </tr>

    <tr>

        <td>Upload Resume</td>
        <td><input type="file" name="file"></td>

    </tr>

    <centre>
    <tr>
        
           <td colspan="2" align="center"> <button type="submit">Register</button> <button type="submit">Submit</button> </td> 
        
    </tr>
</centre>


</table>
</form>




</body>
</html>
